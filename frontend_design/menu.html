<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Menu | Aromea Café</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .menu-page {
            padding: 60px 0;
        }

        .category-section {
            margin-bottom: 60px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 0.6s forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .category-title {
            font-size: 2rem;
            color: var(--primary-color);
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 10px;
            margin-bottom: 30px;
            display: inline-block;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        .menu-card {
            background: var(--white);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: var(--transition);
            position: relative;
        }

        .menu-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
        }

        .menu-img {
            height: 200px;
            width: 100%;
            object-fit: cover;
        }

        .menu-content {
            padding: 20px;
        }

        .menu-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .menu-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem;
            color: var(--text-color);
            font-weight: 700;
        }

        .menu-price {
            color: var(--accent-color);
            font-weight: 700;
            font-size: 1.1rem;
        }

        .menu-desc {
            color: var(--text-light);
            font-size: 0.9rem;
            margin-bottom: 15px;
            height: 45px; /* fixed height for alignment */
        }

        .menu-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .badges {
            display: flex;
            gap: 10px;
        }

        .badge {
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 600;
        }

        .badge-veg {
            background-color: #e6f4ea;
            color: var(--success);
            border: 1px solid var(--success);
        }

        .badge-nonveg {
            background-color: #fce8e6;
            color: #d93025;
            border: 1px solid #d93025;
        }

        .btn-add {
            padding: 8px 15px;
            font-size: 0.9rem;
        }

        .out-of-stock {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        
        .img-wrapper {
            position: relative;
        }

        .card-disabled {
            opacity: 0.7;
            pointer-events: none;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--primary-color);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 2000;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo"><i class="fa-solid fa-mug-hot"></i> Aromea</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="menu.html" class="active">Menu</a></li>
                <li><a href="catalogue.html">Catalogue</a></li>
                <li><a href="reservation.html">Reservations</a></li>
                <li><a href="feedback.html">Feedback</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <div class="nav-icons">
                <a href="login.html" title="Login / Register"><i class="fa-regular fa-user"></i></a>
                <a href="cart.html" title="View Cart">
                    <i class="fa-solid fa-basket-shopping"></i>
                    <span class="cart-badge" id="cart-badge" style="display: none;">0</span>
                </a>
                <div class="mobile-menu-btn"><i class="fa-solid fa-bars"></i></div>
            </div>
        </div>
    </nav>

    <header class="page-header">
        <div class="container">
            <h1>Our Exquisite Menu</h1>
            <p>From rich espresso shots to delightful healthy snacks, explore our selection.</p>
        </div>
    </header>

    <section class="menu-page">
        <div class="container" id="menu-container">
            <!-- Categories will be injected here by JS -->
        </div>
    </section>

    <!-- Includes footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom" style="margin-top: 0; padding-top: 20px;">
                <p>&copy; 2024 Aromea Café. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="js/menuData.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadMenu();
        });

        async function loadMenu() {
            try {
                const response = await apiCall('/menu');
                if (!response.ok) throw new Error('Failed to load menu');
                const menuItems = await response.json();
                renderMenu(menuItems);
            } catch (error) {
                console.error('Error loading menu:', error);
                // Fallback to static data if API fails
                console.log('Falling back to static data');
                renderMenu(window.menuItems || []);
            }
        }

        function renderMenu(menuItems) {
            const container = document.getElementById('menu-container');
            if (!container) return;
            container.innerHTML = '';
            
            // Group items by category
            const categories = {};
            menuItems.forEach(item => {
                const category = item.category_name || item.category || 'Other';
                if (!categories[category]) categories[category] = [];
                categories[category].push(item);
            });

            const categoryNames = Object.keys(categories);
            categoryNames.forEach((category, index) => {
                const section = document.createElement('div');
                section.className = 'category-section';
                section.style.animationDelay = `${index * 0.2}s`;

                const title = document.createElement('h2');
                title.className = 'category-title';
                title.textContent = category;
                section.appendChild(title);

                const grid = document.createElement('div');
                grid.className = 'menu-grid';

                const items = categories[category];
                items.forEach(item => {
                    const isVegItem = item.is_veg === 1 || item.is_veg === true || item.isVeg === true;
                    const vegBadge = isVegItem
                        ? `<span class="badge badge-veg"><i class="fa-solid fa-leaf"></i> Veg</span>`
                        : `<span class="badge badge-nonveg"><i class="fa-solid fa-drumstick-bite"></i> Non-Veg</span>`;
                    
                                        const isAvailItem = item.is_available === 1 || item.is_available === true || item.isAvailable === true;
                    const availabilityTag = !isAvailItem ? `<span class="out-of-stock">Sold Out</span>` : '';
                    const btnClass = isAvailItem ? 'btn btn-add' : 'btn btn-add card-disabled';
                    const btnText = isAvailItem ? 'Add to Cart' : 'Unavailable';

                    // Derive the actual image using the helper from menuData.js if available, or basic mapping
                    const mappedImage = (typeof mapLocalImage === 'function') 
                        ? mapLocalImage(item.item_id || item.id || item.name) 
                        : 'images/placeholder.jpg';

                    const card = document.createElement('div');
                    card.className = 'menu-card';
                    card.innerHTML = `
                        <div class="img-wrapper">
                            <img src="${mappedImage}" alt="${item.name}" class="menu-img">
                            ${availabilityTag}
                        </div>

                        <div class="menu-content">
                            <div class="menu-header">
                                <h3 class="menu-name">${item.name}</h3>
                                <div class="menu-price">₹${item.price}</div>
                            </div>
                            <p class="menu-desc">${item.description || ''}</p>
                            <div class="menu-footer">
                                <div class="badges">
                                    ${vegBadge}
                                </div>
                                <button class="${btnClass}" onclick="addToCart(${item.item_id || item.id})">${btnText}</button>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });

                section.appendChild(grid);
                container.appendChild(section);
            });
        }

        function addToCart(itemId) {
            if (!isLoggedIn()) {
                window.showToast('Please login to add items to cart', 'error');
                setTimeout(() => window.location.href = 'login.html', 1500);
                return;
            }

            // Find the item from menu data, supporting both backend and static schema
            const item = window.menuItems && window.menuItems.find(i => i.id === itemId || i.item_id === itemId);
            if (!item) {
                console.warn('Item not found with id:', itemId);
                window.showToast('Item not found', 'error');
                return;
            }

            const available = item.isAvailable ?? item.is_available;
            if (!available) {
                window.showToast('Item is not available', 'error');
                return;
            }
            
            let cart = getCart();
            const existingItem = cart.find(i => i.id === itemId || i.item_id === itemId);
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ ...item, id: item.id || item.item_id, quantity: 1 });
            }

            localStorage.setItem('aromea_cart', JSON.stringify(cart));
            updateCartBadge();
            window.showToast('Item added to cart!', 'success');
        }
    </script>
</body>
</html>
