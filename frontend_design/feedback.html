<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Feedback | Aromea Café</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .feedback-page {
            padding: 60px 0;
            background-color: var(--light-bg);
            min-height: calc(100vh - 80px - 200px);
        }

        .feedback-card {
            max-width: 600px;
            margin: 0 auto;
            background: var(--white);
            border-radius: 12px;
            box-shadow: var(--shadow);
            padding: 40px;
            text-align: center;
        }

        .rating-box {
            margin: 30px 0;
        }

        .stars {
            display: flex;
            justify-content: center;
            flex-direction: row-reverse; /* For CSS peer hovering */
            gap: 10px;
        }

        .stars input {
            display: none;
        }

        .stars label {
            font-size: 2.5rem;
            color: #ccc;
            cursor: pointer;
            transition: var(--transition);
        }

        /* Hovering highlights stars up to that point */
        .stars label:hover,
        .stars label:hover ~ label,
        .stars input:checked ~ label {
            color: #FFD700;
        }

        .feedback-form textarea {
            width: 100%;
            padding: 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-family: inherit;
            font-size: 1rem;
            resize: vertical;
            min-height: 120px;
            margin-bottom: 20px;
        }

        .feedback-form textarea:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(212, 163, 115, 0.2);
        }

        .thank-you {
            display: none;
            color: var(--success);
            margin-top: 20px;
            font-weight: 500;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo"><i class="fa-solid fa-mug-hot"></i> Aromea</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="catalogue.html">Catalogue</a></li>
                <li><a href="reservation.html">Reservations</a></li>
                <li><a href="feedback.html" class="active">Feedback</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <div class="nav-icons">
                <a href="login.html" title="Login / Register"><i class="fa-regular fa-user"></i></a>
                <a href="cart.html" title="View Cart">
                    <i class="fa-solid fa-basket-shopping"></i>
                    <span class="cart-badge" id="cart-badge" style="display: none;">0</span>
                </a>
                <div class="mobile-menu-btn"><i class="fa-solid fa-bars"></i></div>
            </div>
        </div>
    </nav>

    <header class="page-header">
        <div class="container">
            <h1>Your Opinion Matters</h1>
            <p>Help us improve by sharing your experience at Aromea Café.</p>
        </div>
    </header>

    <section class="feedback-page">
        <div class="container">
            <div class="feedback-card">
                <i class="fa-regular fa-comments fa-3x" style="color: var(--accent-color); margin-bottom: 20px;"></i>
                <h3 style="font-family: 'Playfair Display', serif; color: var(--primary-color);">Rate your visit</h3>
                
                <form class="feedback-form" id="feedbackForm" onsubmit="handleFeedback(event)">
                    
                    <div class="rating-box">
                        <div class="stars">
                            <input type="radio" name="rate" id="star5" value="5" required>
                            <label for="star5" title="Excellent"><i class="fa-solid fa-star"></i></label>
                            
                            <input type="radio" name="rate" id="star4" value="4">
                            <label for="star4" title="Good"><i class="fa-solid fa-star"></i></label>
                            
                            <input type="radio" name="rate" id="star3" value="3">
                            <label for="star3" title="Average"><i class="fa-solid fa-star"></i></label>
                            
                            <input type="radio" name="rate" id="star2" value="2">
                            <label for="star2" title="Poor"><i class="fa-solid fa-star"></i></label>
                            
                            <input type="radio" name="rate" id="star1" value="1">
                            <label for="star1" title="Terrible"><i class="fa-solid fa-star"></i></label>
                        </div>
                    </div>

                    <textarea placeholder="Tell us more about your experience (optional)..." id="feedbackMsg"></textarea>
                    
                    <button type="submit" class="btn" style="width: 100%;">Submit Feedback</button>
                    
                    <div class="thank-you" id="thankYouMsg">
                        <i class="fa-solid fa-heart"></i> Thank you for your feedback! It helps us grow.
                    </div>
                </form>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom" style="margin-top: 0; padding-top: 20px;">
                <p>&copy; 2024 Aromea Café. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script>
        async function handleFeedback(e) {
            e.preventDefault();
            const token = localStorage.getItem('aromea_token');
            if (!token) {
                showToast('Please log in first to submit feedback!', 'error');
                setTimeout(() => window.location.href = 'login.html', 1500);
                return;
            }

            const btn = e.target.querySelector('button[type="submit"]');
            
            const rating = document.querySelector('input[name="rate"]:checked').value;
            const message = document.getElementById('feedbackMsg').value;

            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Submitting...';
            btn.disabled = true;

            try {
                const res = await fetch('http://localhost:5000/api/feedback', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}` 
                    },
                    body: JSON.stringify({ rating, message })
                });

                if (res.ok) {
                    btn.style.display = 'none';
                    document.getElementById('thankYouMsg').style.display = 'block';
                } else {
                    const data = await res.json();
                    showToast(data.msg || "Failed to submit feedback.", "error");
                    btn.innerHTML = 'Submit Feedback';
                    btn.disabled = false;
                }
            } catch (err) {
                console.error(err);
                showToast("An error occurred. Please try again.", "error");
                btn.innerHTML = 'Submit Feedback';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
